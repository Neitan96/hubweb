# Confere a cada push/PR: valida os JSON de exemplo e compila o APK debug.
name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Validar os JSON de exemplo
        shell: pwsh
        run: ./tools/validar-chaves.ps1

      - name: Compilar (debug)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
